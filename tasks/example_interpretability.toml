task_type = 'interpretability'

[meta]
title = 'ViT Grad Rollout Example'
description = 'Example interpretability task for avgpool ViT'
creator = 'system'
created_at = '2026-03-29'
commit = 'auto'

[dataset]
type = 'sheet'
root = 'data/mae/internal_labeled'
sheet = 'data/mae/internal_labeled/labels.xlsx'
column = 1
label_offset = -1
have_header = true

[dataset.split]
method = 'ratio'
val_ratio = 0.2
seed = 3407
stratified = true

[model]
family = 'mae_finetune'
name = 'vit_base_patch16'
pretrained = false
checkpoint = 'outputs/mae/p4/best.pth'
num_classes = 2
global_pool = 'avg'
drop_path = 0.1
img_size = 224

[runtime]
split_name = 'val'
max_samples = 5
target_class_mode = 'pred'
start_layer = 0
input_size = 224
seed = 3407

[output]
save_path = 'outputs/{task_id}'
log = false
