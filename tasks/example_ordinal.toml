task_type = "ordinal"

[meta]
title = "ResNet34 Ordinal Classification"
description = "使用 ResNet34 进行有序分类训练"

[dataset]
type = "sheet"
root = "/path/to/dataset"
sheet = "/path/to/dataset/labels.xlsx"
sheet_name = "Sheet1"
column = 1
label_offset = 0
have_header = true

[dataset.split]
method = "ratio"
val_ratio = 0.1
seed = 42

[model]
name = "resnet34"
pretrained = true
num_classes = 5
method = "ce"
# checkpoint = "/path/to/checkpoint.pth"

[training]
epochs = 30
batch_size = 64
lr = 1e-4
weight_decay = 0.05
warmup_epochs = 0
min_lr = 1e-6
accum_iter = 1
use_scheduler = true
use_amp = true
# clip_grad = 1.0
num_workers = 4

[training.transform]
train = "rectangle_train"
val = "rectangle_val"

[output]
save_path = "outputs/{task_id}"
keep_count = 1
save_best = true
log = true
