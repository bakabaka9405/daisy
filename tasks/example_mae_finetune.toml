task_type = "mae_finetune"

[meta]
title = "MAE 微调 示例任务"
description = "根据 mae_finetune 的注册配置自动生成"
creator = "your_name"
created_at = "2026-03-16"
commit = "auto"

[output]
save_path = "outputs/{task_id}"
keep_count = 1
save_best = true
log = true

[dataset]
type = "sheet"
root = ""
column = 1
label_offset = 0
have_header = true

[dataset.split]
method = "ratio"
val_ratio = 0.1
stratified = false
preset_train_dir = "train"
preset_val_dir = "val"
preset_test_dir = "test"

[model]
name = "vit_base_patch16"
num_classes = 1000
global_pool = "avg"
drop_path = 0.1
img_size = 224

[training]
epochs = 100
batch_size = 64
lr = 0.0
blr = 0.0005
layer_decay = 0.65
weight_decay = 0.05
warmup_epochs = 5
min_lr = 1e-06
accum_iter = 1
use_amp = true
num_workers = 4
save_freq = 20

[training.augment]
input_size = 224
aa = "rand-m9-mstd0.5-inc1"
reprob = 0.25
remode = "pixel"
recount = 1
mixup = 0.8
cutmix = 1.0
smoothing = 0.1
